name: reload-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Build tag
        required: true
        type: string
      ref:
        description: Source ref to build
        required: true
        type: string
      platform:
        description: Artifact kind
        required: true
        default: macos-release
        type: choice
        options:
          - macos-release
      runner:
        description: macOS runner label
        required: false
        default: blacksmith-6vcpu-macos-26
        type: string
      nonce:
        description: Run correlation marker
        required: false
        default: ""
        type: string

run-name: "reload-build ${{ inputs.tag }} ${{ inputs.platform }} ${{ inputs.nonce }}"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      CMUX_SKIP_ZIG_BUILD: "1"
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: daemon/remote/go.mod
          cache-dependency-path: daemon/remote/go.sum

      - name: Provision native dependencies
        run: |
          set -euo pipefail
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Build arm64 Release app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spm"
          CMUX_SKIP_ZIG_BUILD=1 xcodebuild \
            -scheme cmux \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/cmux-release-dd" \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CMUX_GIT_SHA="$(git rev-parse --short HEAD)" \
            build
          app="$RUNNER_TEMP/cmux-release-dd/Build/Products/Release/cmux.app"
          test -x "$app/Contents/MacOS/cmux"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "$app" artifact/app.zip

      - name: Upload Release app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reload-${{ inputs.tag }}-${{ inputs.platform }}
          path: artifact/app.zip
          retention-days: 1
          if-no-files-found: error
